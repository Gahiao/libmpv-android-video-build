name: Build libmpv-android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release of the build'
        required: false
        default: false
        type: boolean
      mpv_vulkan:
        description: 'Enable mpv Vulkan'
        required: true
        default: true
        type: boolean
      libplacebo_vulkan:
        description: 'Enable libplacebo Vulkan'
        required: true
        default: true
        type: boolean
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

permissions:
  contents: write

env:
  NDK_VER: 27.1.12297006
  MPV_VULKAN: ${{ inputs.mpv_vulkan && 'enabled' || 'disabled' }}
  LIBPLACEBO_VULKAN: ${{ inputs.libplacebo_vulkan && 'enabled' || 'disabled' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_default.sh
          ./bundle_default.sh
      # - name: Bundle (full)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_full.sh
      #     ./bundle_full.sh
      # - name: Bundle (encoders-gpl)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_encoders-gpl.sh
      #     ./bundle_encoders-gpl.sh
      - name: Generate checksums
        working-directory: ./output
        run: sha256sum *.jar > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: ./output/*

      # PiliNara 构建时从 releases/latest/download 自动拉取这里的滚动 release。
      # 打开 Vulkan 的手动 Build 会更新 libmpv-latest，App 无需再手工替换 jar。
      - name: Publish rolling libmpv release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mpv_vulkan && inputs.libplacebo_vulkan }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: libmpv-latest
          name: libmpv latest
          body: |
            PiliNara 自动拉取的最新 libmpv 构建。
            提交：${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            output/*.jar
            output/SHA256SUMS

      - name: Set Tag Name
        if: ${{ github.event.inputs.release == 'true' }}
        run: echo "TAG_NAME=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          make_latest: false
          files: |
            output/*.jar
            output/SHA256SUMS
